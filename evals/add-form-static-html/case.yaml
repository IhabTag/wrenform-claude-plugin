schema_version: "1.1"
name: add-form-static-html
description: "AC-112: a plain HTML site gets a labelled contact page, a thanks page wired as success_url, and a test submission."
tags: [add-contact-form, signed-in]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
  prompt: "/wrenform:add-contact-form contact e2e@example.com - the site will live at https://harborpottery.com"
