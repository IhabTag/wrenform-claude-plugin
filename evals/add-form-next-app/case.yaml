schema_version: "1.1"
name: add-form-next-app
description: "AC-113: a Next.js App Router site gets a client component with inline success and error states, linked from the page, and a test submission."
tags: [add-contact-form, signed-in]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
  prompt: "Add a contact form to this site. Messages should go to e2e@example.com. Production is https://northwind.studio."
